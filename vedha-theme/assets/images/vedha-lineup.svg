<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEAE4"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.08)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="450" fill="#F4F3EE" rx="16"/>
  <ellipse cx="300" cy="380" rx="220" ry="24" fill="url(#shadowGrad)"/>

  <!-- 5-Litre Bulk Can (Left/Center) -->
  <g transform="translate(130, 110)">
    <!-- Can Body -->
    <rect x="0" y="70" width="180" height="200" rx="20" fill="url(#canGrad)" stroke="#D8D5CD" stroke-width="2"/>
    <!-- Handle -->
    <path d="M40 70 L40 30 Q40 18 55 18 L125 18 Q140 18 140 30 L140 70" fill="none" stroke="#D8D5CD" stroke-width="16" stroke-linecap="round"/>
    <!-- Cap -->
    <rect x="130" y="38" width="40" height="24" rx="4" fill="#D4161C"/>
    <!-- Label -->
    <rect x="20" y="110" width="140" height="120" rx="8" fill="#FFFFFF" stroke="#E2DFD7" stroke-width="1"/>
    <rect x="20" y="110" width="140" height="18" fill="#14602F"/>
    <text x="90" y="123" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1">5-LITRE BULK CAN</text>
    <text x="90" y="152" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">VEDHA</text>
    <text x="90" y="172" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#14602F">PLANT-BASED &amp; BIO</text>
    <text x="90" y="195" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#71717A">Bangalore Concentrated Care</text>
    <text x="90" y="215" text-anchor="middle" font-family="'Inter', monospace" font-size="11" font-weight="700" fill="#D4161C">5000 ml</text>
  </g>

  <!-- 1-Litre Dispenser Bottle (Right) -->
  <g transform="translate(340, 150)">
    <!-- Bottle Body -->
    <rect x="0" y="70" width="110" height="160" rx="16" fill="#FFFFFF" stroke="#D8D5CD" stroke-width="2"/>
    <!-- Bottle Neck -->
    <path d="M35 70 L35 30 L75 30 L75 70 Z" fill="#FFFFFF" stroke="#D8D5CD" stroke-width="2"/>
    <!-- Dispenser Cap / Pump -->
    <rect x="38" y="20" width="34" height="14" rx="2" fill="#D4161C"/>
    <path d="M55 20 L55 8 L78 8" stroke="#D4161C" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Label -->
    <rect x="12" y="90" width="86" height="110" rx="6" fill="#FFFFFF" stroke="#E2DFD7" stroke-width="1"/>
    <rect x="12" y="90" width="86" height="14" fill="#D4161C"/>
    <text x="55" y="101" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">1-LITRE PACK</text>
    <text x="55" y="126" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#1A1A1A">VEDHA</text>
    <text x="55" y="144" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#14602F">HIGH-ACTIVE</text>
    <text x="55" y="162" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#71717A">pH 7 Neutral Science</text>
    <text x="55" y="185" text-anchor="middle" font-family="'Inter', monospace" font-size="10" font-weight="700" fill="#1A1A1A">1000 ml</text>
  </g>
</svg>
